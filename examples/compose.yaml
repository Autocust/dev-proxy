name: dev-proxy-demo

services:
  whoami:
    image: traefik/whoami:v1.11
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.dev-proxy-demo.rule=Host(`demo.docker.localhost`)
      - traefik.http.routers.dev-proxy-demo.entrypoints=web
      - traefik.http.routers.dev-proxy-demo.service=dev-proxy-demo
      - traefik.http.services.dev-proxy-demo.loadbalancer.server.port=80
    networks:
      - dev-proxy

networks:
  dev-proxy:
    external: true
    name: dev-proxy
