# Snippet to adapt into the project's compose.yaml (do NOT run it directly).
# Keep the existing image/build, volumes, depends_on and default network.
services:
  nginx:
    # image: nginx:alpine   # or build: ...
    # REMOVE port 80 publishing: do NOT use ports: ["80:80"].
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.my-project.rule=Host(`app.my-project.localhost`)
      - traefik.http.routers.my-project.entrypoints=web
      - traefik.http.routers.my-project.service=my-project
      - traefik.http.services.my-project.loadbalancer.server.port=80
    networks:
      - default
      - dev-proxy

networks:
  dev-proxy:
    external: true
    name: dev-proxy
