# Frammento da adattare nel compose.yaml del progetto (NON avviarlo direttamente).
# Mantieni image/build, volumes, depends_on e la rete default già esistenti.
services:
  nginx:
    # image: nginx:alpine   # oppure build: ...
    # RIMUOVI la pubblicazione della porta 80: NON usare ports: ["80:80"].
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-proxy
      - traefik.http.routers.mio-progetto.rule=Host(`app.mio-progetto.localhost`)
      - traefik.http.routers.mio-progetto.entrypoints=web
      - traefik.http.routers.mio-progetto.service=mio-progetto
      - traefik.http.services.mio-progetto.loadbalancer.server.port=80
    networks:
      - default
      - dev-proxy

networks:
  dev-proxy:
    external: true
    name: dev-proxy
