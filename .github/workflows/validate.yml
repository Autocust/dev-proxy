name: Validate Compose
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate proxy Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Validate demo Compose
        run: docker compose -f examples/compose.yaml config --quiet
      - name: Shell syntax
        run: sh -n scripts/check.sh
